services:
  postgres:
    image: postgres:15-alpine
    container_name: benchmark_postgres
    restart: always
    environment:
      POSTGRES_DB: benchmark_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - benchmark_net

  redis:
    image: redis:alpine
    container_name: benchmark_redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - benchmark_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: benchmark_backend
    restart: always
    ports:
      - '3002:3001'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/benchmark_db?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    networks:
      - benchmark_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3002/api
    container_name: benchmark_frontend
    restart: always
    ports:
      - '3005:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3002/api
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - benchmark_net

volumes:
  postgres_data:

networks:
  benchmark_net:
    driver: bridge
